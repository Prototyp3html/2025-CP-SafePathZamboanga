name: Flood Data Auto Update

on:
  schedule:
    - cron: "0 */6 * * *" # runs every 6 hours
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Call Flood Update Endpoint (POST with Headers)
        run: |
          # Timeout set to 2700 seconds (45 minutes) to allow flood data processing
          curl -v --http1.1 --max-time 2700 \
          -X POST "https://safepath-zc-production.up.railway.app/cron/flood-data-update" \
          -H "X-Cron-Secret: safepath-flood-update-secret-key-2025" \
          -H "Content-Type: application/json"
        continue-on-error: true

      - name: Fallback - Call via GET with secret parameter
        if: failure()
        run: |
          # Fallback with extended timeout
          curl -v --http1.1 --max-time 2700 \
          "https://safepath-zc-production.up.railway.app/cron/flood-data-update?secret=safepath-flood-update-secret-key-2025" \
          -H "Content-Type: application/json"
        continue-on-error: true

      - name: Log completion
        run: echo "Flood data update workflow completed"
